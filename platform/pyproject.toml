[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aimem-platform"
version = "0.1.0"
description = "AIMEM Design Studio control plane: audit backbone, sandboxed tool runs, and agent missions"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0.30,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "pyyaml>=6,<7",
  "opentelemetry-api>=1.25,<2",
  "opentelemetry-sdk>=1.25,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The hosted model route (Claude). Only needed when AIMEM_ANTHROPIC_API_KEY is set and a mission opts in.
hosted = ["anthropic>=1,<2"]

[project.scripts]
aimem-platform = "aimem_platform.cli:main"

[tool.setuptools.packages.find]
include = ["aimem_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "error::pytest.PytestUnraisableExceptionWarning",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]
